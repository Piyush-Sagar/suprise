<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Gift For You!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-500">

    <div class="min-h-screen flex flex-col items-center justify-center p-4 text-center">
        
        <h1 id="title" class="fancy-title text-4xl md:text-6xl text-pink-500 mb-4 transition-opacity duration-500">A surprise is waiting for you!</h1>
        <p id="subtitle" class="text-lg md:text-xl mb-8 transition-opacity duration-500">Click the gift box to open it.</p>

        <div id="gift-container" class="relative">
            <img id="gift-box" 
                 src="gift1.png" 
                 alt="A closed gift box"
                 class="w-48 h-48 md:w-64 md:h-64 object-contain cursor-pointer transition-transform duration-200 hover:scale-110"
                 onerror="this.onerror=null; this.src='https://placehold.co/256x256/f87171/ffffff?text=Gift!';">
        </div>

        <div id="video-container" class="hidden w-[90vw] max-w-7xl video-container">
            <video id="video-player" playsinline loop>
                <source src="./hbd.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
