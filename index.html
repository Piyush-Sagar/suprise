<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff8f1">
    <meta name="description" content="A birthday present. Try to look surprised.">
    <title>A little birthday surprise</title>
    <link rel="icon" href="gift1.png">
    <link rel="stylesheet" href="style.css">
    <script src="scene.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <section id="wrapping" aria-labelledby="quip">
        <h1 id="quip" aria-live="polite">Try to look surprised.</h1>
        <button id="gift" type="button">
          <span class="present">
            <canvas id="scene" width="196" height="188" aria-hidden="true"></canvas>
            <span id="tag" hidden><img id="portrait" alt=""></span>
          </span>
          <span id="action">Unwrap it</span>
        </button>
        <button id="personalize" type="button" aria-haspopup="dialog">Personalize</button>
      </section>
      <section id="surprise" aria-label="Happy birthday" hidden>
        <video id="movie" src="hbd.mp4" playsinline loop controls preload="none"
          aria-label="Your birthday video"></video>
        <p id="video-note" role="status" hidden></p>
        <button id="restart" type="button">Wrap it back up</button>
      </section>
    </main>
    <dialog id="editor" aria-labelledby="editor-title">
      <form id="gift-form">
        <h2 id="editor-title">Make it personal.</h2>
        <label for="recipient">Birthday person's name</label>
        <input id="recipient" type="text" maxlength="48" autocomplete="off">
        <label for="photo">Gift tag photo</label>
        <input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/avif,image/gif">
        <div id="photo-preview" hidden>
          <img id="thumbnail" alt="Gift tag preview">
          <button type="button" id="remove-photo">Remove photo</button>
        </div>
        <p class="hint">Both are optional and saved in this browser.</p>
        <p id="photo-error" role="alert" hidden></p>
        <div class="actions">
          <button type="button" id="cancel">Cancel</button>
          <button type="submit" id="save">Save</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
